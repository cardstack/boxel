server_name: "localhost"
pid_file: /data/homeserver.pid
public_baseurl: "http://localhost:8008"
# Rooms are created as room version 10. Room version 12 rejects a room
# creator listed in power_level_content_override.users, which the host's
# room creation sends, and its room IDs carry no server name. The deployed
# homeserver config pins the same version.
default_room_version: "10"
listeners:
  - port: 8008
    tls: false
    bind_addresses: ["::"]
    type: http
    x_forwarded: true

    resources:
      - names: [client, federation]
        compress: false

database:
  name: "sqlite3"
  args:
    database: ":memory:"

log_config: "/data/log.config"

presence:
  enabled: false

retention:
  enabled: true

rc_messages_per_second: 10000
rc_message_burst_count: 10000
rc_registration:
  per_second: 10000
  burst_count: 10000
rc_joins:
  local:
    per_second: 9999
    burst_count: 9999
  remote:
    per_second: 9999
    burst_count: 9999
rc_joins_per_room:
  per_second: 9999
  burst_count: 9999
# Rooms are created per user: the realm server's Matrix user creates a
# session room on each user's first sign-in, and the host creates a room for
# every new AI assistant chat. The realm server also looks up profiles
# without an access token. So neither room creation nor profile lookups are
# limited here.
rc_room_creation:
  per_second: 10000
  burst_count: 10000
rc_profile:
  per_second: 10000
  burst_count: 10000
rc_3pid_validation:
  per_second: 1000
  burst_count: 1000

rc_invites:
  per_room:
    per_second: 1000
    burst_count: 1000
  per_user:
    per_second: 1000
    burst_count: 1000

rc_login:
  address:
    per_second: 10000
    burst_count: 10000
  account:
    per_second: 10000
    burst_count: 10000
  failed_attempts:
    per_second: 10000
    burst_count: 10000

media_store_path: "/data/media_store"
uploads_path: "/data/uploads"
enable_registration: true
enable_registration_without_verification: true
disable_msisdn_registration: false
registration_shared_secret: "{{REGISTRATION_SECRET}}"
registrations_require_3pid:
  - email
registration_requires_token: true
report_stats: false
macaroon_secret_key: "{{MACAROON_SECRET_KEY}}"
form_secret: "{{FORM_SECRET}}"
signing_key_path: "/data/localhost.signing.key"

trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

ui_auth:
  session_timeout: "300s"

login_via_existing_session:
  enabled: true
  require_ui_auth: false
  token_timeout: "2m"
  # Synapse rate-limits get_token to one request per minute per user id. That
  # limit is hardcoded in the servlet — no rc_* setting and no admin
  # override_ratelimit relaxes it — so anything minting more than one token
  # per minute needs a distinct account per mint.

email:
  smtp_host: "boxel-smtp"
  smtp_port: 25
  enable_tls: false
  notif_from: "%(app)s <noreply@example.com>"
  app_name: "Boxel"
  enable_notifs: true
  notif_for_new_users: false
  client_base_url: "http://localhost:4200"
  validation_token_lifetime: "1h"
  subjects:
    email_validation: "%(app)s Email Validation"

templates:
  custom_template_directory: "/data/templates/"

experimental_features:
  msc3575_enabled: true
  msc3874_enabled: true
