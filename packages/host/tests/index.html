<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Boxel Tests</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Declares the boxel-ui cascade layer order. It lives here, ahead of
         every stylesheet, because a layer's first appearance is what fixes its
         precedence and bundlers prune this statement out of global.css. Mirrors
         @cardstack/boxel-ui/styles/global.css — keep the two in sync. -->
    <style>
      @layer vendor, reset, utilities, boxelComponentL1, boxelComponentL2,
        boxelComponentL3, boxelComponentL4;
    </style>

    {{content-for "head"}} {{content-for "test-head"}}

    <link rel="stylesheet" href="/@embroider/virtual/vendor.css" />
    <link rel="stylesheet" href="/@embroider/virtual/app.css" />
    <link rel="stylesheet" href="/@embroider/virtual/test-support.css" />

    {{content-for "head-footer"}} {{content-for "test-head-footer"}}
  </head>
  <body>
    {{content-for "body"}} {{content-for "test-body"}}

    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <div id="ember-basic-dropdown-wormhole"></div>
    <script>
      globalThis.process = {
        env: {},
        browser: true,
        version: '',
        versions: {},
        platform: 'browser',
        nextTick(fn, ...args) {
          Promise.resolve().then(() => fn(...args));
        },
        cwd() {
          return '';
        },
      };
      globalThis.global = globalThis;
    </script>

    <script src="/testem.js" integrity="" data-embroider-ignore></script>
    <script src="/@embroider/virtual/vendor.js"></script>
    <script src="/@embroider/virtual/test-support.js"></script>

    <script type="module">
      import 'ember-testing';
    </script>
    <script type="module">
      import { start } from './test-helper';
      let availableModules = import.meta.glob('./**/*-test.{js,ts,gjs,gts}');

      await start({ availableModules });
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
