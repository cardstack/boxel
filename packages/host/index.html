<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Declares the boxel-ui cascade layer order. It lives here, ahead of
         every stylesheet, because a layer's first appearance is what fixes its
         precedence and bundlers prune this statement out of global.css. Mirrors
         @cardstack/boxel-ui/styles/global.css — keep the two in sync. -->
    <style>
      @layer vendor, reset, utilities, boxelComponentL1, boxelComponentL2,
        boxelComponentL3, boxelComponentL4;
    </style>

    {{content-for "head"}}

    <script>
      // Resolve dynamic-import chunk URLs against the host's distURL rather
      // than the document origin — the HTML may be served by realm-server
      // on a different origin than the built assets. See the
      // experimental.renderBuiltUrl hook in vite.config.mjs.
      (function () {
        var meta = document.querySelector(
          'meta[name="@cardstack/host/config/environment"]',
        );
        var assetsURL = '/';
        if (meta) {
          try {
            var config = JSON.parse(decodeURIComponent(meta.content));
            if (config && config.assetsURL) assetsURL = config.assetsURL;
          } catch (e) {}
        }
        globalThis.__boxelAssetsURL = assetsURL;
      })();
    </script>

    <!-- Until the app renders, the app's page is the colour its loading
         screen is about to be (see templates/loading.gts): the dark sign-in
         colour when no session is stored, the operator-mode colour when one
         is. The dark colour scheme also darkens the frame the browser paints
         before the page's stylesheets arrive. A redirect into the app, such as
         back from the secure origin after signing in or out, then never
         flashes white. Both come off once the app has rendered something, so
         the app keeps its own colour scheme. A published realm's page (host
         mode, as services/host-mode-service.ts decides it) keeps the plain
         page. -->
    <script>
      (function () {
        try {
          var meta = document.querySelector(
            'meta[name="@cardstack/host/config/environment"]',
          );
          var config = JSON.parse(decodeURIComponent(meta.content));
          var host = window.location.hostname;
          var realmServerHost = config.realmServerURL
            ? new URL(config.realmServerURL).hostname
            : undefined;
          var simulatingHostMode = new URLSearchParams(
            window.location.search,
          ).has('hostModeOrigin');
          var isApp =
            !simulatingHostMode &&
            (config.hostsOwnAssets ||
              (realmServerHost !== undefined &&
                host.endsWith(realmServerHost) &&
                !host.endsWith('.localhost')));
          if (!isApp) {
            return;
          }
          var root = document.documentElement;
          root.setAttribute(
            'data-boxel-boot',
            window.localStorage.getItem('auth') ? 'signed-in' : 'signed-out',
          );
          var colorScheme = document.createElement('meta');
          colorScheme.name = 'color-scheme';
          colorScheme.content = 'dark';
          document.head.appendChild(colorScheme);
          var appHasRendered = function () {
            return Array.prototype.some.call(
              document.body ? document.body.children : [],
              function (child) {
                return (
                  child.tagName !== 'SCRIPT' &&
                  child.id !== 'ember-basic-dropdown-wormhole'
                );
              },
            );
          };
          new MutationObserver(function (_records, observer) {
            if (appHasRendered()) {
              root.removeAttribute('data-boxel-boot');
              colorScheme.remove();
              observer.disconnect();
            }
          }).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
    <style>
      [data-boxel-boot='signed-in'] body {
        background-color: #686283;
      }
      [data-boxel-boot='signed-out'] body {
        background-color: #191624;
      }
    </style>

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css" />
    <link integrity="" rel="stylesheet" href="/@embroider/virtual/app.css" />
    <link href="/boxel-favicon.png" rel="icon" type="image/x-icon" />
    <link href="/boxel-webclip.png" rel="apple-touch-icon" />
    <style>
      /* Allow prerendered cards to scroll while card-specific CSS loads */
      #boxel-isolated-start + .boxel-card-container {
        overflow-y: auto;
      }
    </style>

    {{content-for "head-footer"}}

    <meta data-boxel-head-start />
    <title>Boxel</title>
    <meta data-boxel-head-end />
  </head>
  <body>
    <script type="x/boundary" id="boxel-isolated-start"></script>
    <script type="x/boundary" id="boxel-isolated-end"></script>

    <!-- in case embercli's hooks isn't run,
         we embed the following div manually -->
    <div id="ember-basic-dropdown-wormhole"></div>
    {{content-for "body"}}

    <script>
      globalThis.process = {
        env: {},
        browser: true,
        version: '',
        versions: {},
        platform: 'browser',
        nextTick(fn, ...args) {
          Promise.resolve().then(() => fn(...args));
        },
        cwd() {
          return '';
        },
      };
      globalThis.global = globalThis;
    </script>

    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from './app/app';
      import environment from './app/config/environment';

      Application.create(environment.APP);
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
