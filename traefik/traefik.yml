entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":4230"

api:
  dashboard: true
  insecure: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# INFO adds provider start-up and warnings to the default ERROR-only log.
# Dynamic-configuration reloads are logged only at DEBUG, which also logs two
# lines for every proxied request — tens of thousands per test run — so they
# stay off; a route file's arrival is dated by its mtime in the dynamic
# directory instead.
log:
  level: INFO

# Failures only. A 4xx/5xx that Traefik itself produces — 404 for a host no
# router matches, 502 for an upstream nothing listens on — reaches no service
# log at all, and a browser reports the missing CORS headers on it as a CORS
# error, so this log is the only record that the request happened. JSON keeps
# RequestHost and RouterName as fields; the common format has no host at all.
accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
