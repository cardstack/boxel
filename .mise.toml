# The pnpm below installs through mise's aqua backend, which resolves the
# release asset from the aqua registry snapshot embedded in the mise binary.
# A mise older than this has a snapshot that predates pnpm's move to tarball
# release assets and fails with an opaque "no asset found".
min_version = "2026.9.16"

[tools]
node = "24.17.0"
pnpm = "12.7.0"

[env]
_.source = "./mise-tasks/lib/env-vars.sh"
NODE_NO_WARNINGS = "1"
