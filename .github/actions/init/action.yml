name: Init
description: Setup common dependencies

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      with:
        install: true

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path -s)" >> $GITHUB_OUTPUT

    - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      name: Setup pnpm cache
      id: cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Prune pnpm store
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm store prune

    # Provision the mandatory dev cert so the realm-server can speak
    # HTTPS+HTTP/2 — the only protocol it supports. Local devs get this
    # via `mise run infra:ensure-dev-cert`; CI runs it explicitly here
    # so every downstream job starts with the cert in
    # ~/.local/share/boxel/dev-certs/ and `NODE_EXTRA_CA_CERTS` pointed
    # at mkcert's root. See packages/realm-server/server.ts and
    # mise-tasks/infra/ensure-dev-cert.
    #
    # Every job in the repo runs this action, so Ubuntu's archive mirrors are a
    # dependency of all of CI. apt retries a degraded mirror with long internal
    # timeouts, so an upstream outage makes this hang rather than fail, and an
    # unbounded hang holds a runner until the job's own ceiling — which is how a
    # single archive incident wedged jobs across seven branches for as long as
    # 47 minutes each.
    #
    # `timeout-minutes` is not supported on a composite action's steps, so the
    # ceiling is applied per command instead. `timeout` exits 124 when it fires,
    # which fails the step under the default `-e` shell.
    # Runner network trouble on Azure VMs presents as connections that stall
    # rather than fail, and disabling checksum offload is the long-standing
    # workaround (actions/runner-images#1187). ci-host.yaml already applies
    # this, but only after this action has run — leaving this action's apt call,
    # the one that has actually wedged, in the unmitigated window. Non-fatal:
    # it is a mitigation rather than a requirement, and a runner need not have
    # an interface by this name.
    - name: Disable TCP/UDP network offloading
      shell: bash
      run: |
        sudo ethtool -K eth0 tx off rx off ||
          echo "could not disable offloading on eth0; continuing"

    # apt reaches Ubuntu through Azure Traffic Manager, which resolves to a
    # regional mirror — so an unhealthy backend stalls some runners while
    # others are unaffected, and neither Canonical's nor Azure's status page
    # would report it. A job that wedges in apt uploads no logs at all, so
    # record which mirror this runner resolved to, and how fast it answers,
    # while there is still something to record. Evidence only: never fails the
    # step, and bounded so the probe cannot become the hang it is looking for.
    - name: Probe the apt mirrors
      shell: bash
      run: |
        codename=$(. /etc/os-release && echo "${VERSION_CODENAME:-}")
        mirrors=$(cat /etc/apt/apt-mirrors.txt 2>/dev/null ||
          echo "http://azure.archive.ubuntu.com/ubuntu/")
        while read -r mirror; do
          [ -n "$mirror" ] || continue
          curl -sS --max-time 10 -o /dev/null \
            -w "apt-mirror-probe %{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s $mirror\n" \
            "${mirror%/}/dists/${codename}/InRelease" ||
            echo "apt-mirror-probe UNREACHABLE $mirror"
        done <<< "$mirrors"

    - name: Install mkcert
      shell: bash
      run: |
        timeout 5m sudo apt-get update -o Acquire::Retries=3
        timeout 5m sudo apt-get install -y -o Acquire::Retries=3 mkcert libnss3-tools

    - name: Provision dev TLS cert
      shell: bash
      run: mise run infra:ensure-dev-cert
