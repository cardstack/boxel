name: Install grafanactl
description: |
  Install the pinned grafanactl release on the Ubuntu runner, verifying its
  SHA-256 before placing the binary on PATH. Used by the observability diff,
  preview, preview-sweep and apply workflows.

outputs:
  version:
    description: The grafanactl version installed.
    value: ${{ steps.pin.outputs.version }}

runs:
  using: composite
  steps:
    # grafanactl is still pre-1.0 — bump as needed. The version and the
    # checksum are a single pin and have to move together, so they live here
    # rather than in the five workflows that install it: a version supplied
    # apart from its checksum would fail verification rather than install what
    # was asked for. The checksum is this asset's line in the release's
    # grafanactl_checksums.txt.
    - name: Pin grafanactl
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        version=0.1.10
        {
          echo "version=${version}"
          echo "sha256=7f785c8be5ab6210579ae2bc0fddb9cdf180a2d59d928935adba8e581b69cfa9"
          echo "url=https://github.com/grafana/grafanactl/releases/download/v${version}/grafanactl_Linux_x86_64.tar.gz"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch grafanactl
      id: asset
      uses: ./.github/actions/fetch-cached-release-asset
      with:
        name: grafanactl
        url: ${{ steps.pin.outputs.url }}
        sha256: ${{ steps.pin.outputs.sha256 }}

    # The tarball is what gets cached and checksummed, so it is unpacked afresh
    # each run: that keeps the pinned value the one the release publishes,
    # verifiable against upstream without unpacking anything.
    - name: Install grafanactl
      shell: bash
      env:
        GRAFANACTL_TARBALL: ${{ steps.asset.outputs.path }}
      run: |
        set -euo pipefail
        unpacked="$(mktemp -d)"
        trap 'rm -rf "$unpacked"' EXIT
        tar -xzf "$GRAFANACTL_TARBALL" -C "$unpacked" grafanactl
        sudo install -m 0755 "${unpacked}/grafanactl" /usr/local/bin/grafanactl
        grafanactl --version
