name: Choose the Percy build for this attempt
description: >-
  Picks the PERCY_PARALLEL_NONCE that the host shards upload under and that
  the finalize job seals, so that every attempt of one run that belongs to the
  same Percy build uses the same nonce.

  A run with a failed shard leaves its Percy build open, and "Re-run failed
  jobs" adds the re-run shards to it. A build that was already sealed cannot
  take more snapshots, though, so an attempt after a seal ("Re-run all jobs",
  or re-running one job of a run that passed) needs a new build. After it
  seals a build, the finalize job uploads a `percy-sealed-<attempt>` artifact.
  The nonce is the run id plus the latest attempt that sealed a build, or 0
  when none has: attempts up to and including the next seal share it, and the
  attempt after that seal starts a new build.

  The lookup uses download-artifact, which sees the artifacts of every attempt
  of the run. The REST artifacts list for a run does not reliably return them
  all. A failed lookup fails the step: reusing a sealed nonce would send the
  attempt's snapshots to a build that refuses them.

outputs:
  nonce:
    description: The PERCY_PARALLEL_NONCE for this attempt.
    value: ${{ steps.choose.outputs.nonce }}
  sealed-attempt:
    description: >-
      The latest attempt of this run that sealed a Percy build, or 0. Tallies
      from that attempt and earlier ones belong to an earlier build.
    value: ${{ steps.choose.outputs.sealed_attempt }}

runs:
  using: composite
  steps:
    - name: Download the markers of sealed Percy builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: percy-sealed-*
        path: /tmp/percy-sealed

    - name: Choose the nonce
      id: choose
      shell: bash
      run: |
        set -euo pipefail
        sealed=0
        # download-artifact extracts a pattern's only match straight into the
        # path, and puts each of several matches in a directory named for it.
        for f in /tmp/percy-sealed/percy-sealed.txt /tmp/percy-sealed/*/percy-sealed.txt; do
          [ -f "$f" ] || continue
          attempt=$(tr -dc '0-9' < "$f")
          if [ -n "$attempt" ] && [ "$attempt" -gt "$sealed" ]; then
            sealed=$attempt
          fi
        done
        nonce="${GITHUB_RUN_ID}-after${sealed}"
        echo "Percy nonce for attempt ${GITHUB_RUN_ATTEMPT}: ${nonce} (latest sealed attempt: ${sealed})"
        echo "nonce=${nonce}" >> "$GITHUB_OUTPUT"
        echo "sealed_attempt=${sealed}" >> "$GITHUB_OUTPUT"
