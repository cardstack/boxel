name: Catalog Test Subset Consumers

# Runs the boxel tests that consume the catalog test subset — the host
# `--filter`s and realm-server `TEST_FILES` listed under `tests` in
# packages/catalog/test-subset.json — against a given boxel-catalog commit,
# served as the catalog realm in place of the pinned revision.
#
# boxel-catalog calls this from its Boxel Test Subset workflow whenever a
# catalog change touches a subset file, since the deployed catalog realm serves
# catalog main and a change to one of those definitions has to keep boxel's
# tests passing before it merges. The stack setup lives here, next to the host
# and realm-server CI it follows, so a boxel change to how CI stands up the test
# stack can update what the catalog runs in the same boxel PR, with nothing to
# change in the catalog. The call looks like:
#
#   jobs:
#     boxel-tests:
#       uses: cardstack/boxel/.github/workflows/catalog-test-subset-consumers.yml@main
#       permissions:
#         contents: read
#         packages: read
#       with:
#         boxel_ref: <boxel branch, tag or sha>
#         catalog_ref: ${{ github.sha }}
#
# The caller names this file at a fixed ref (a `uses:` ref can't be an
# expression), so the steps below, and those of the test-web-assets.yaml they
# call, always come from that ref. `boxel_ref` decides the boxel commit those
# steps run against: its tests, its manifest, its mise tasks and composite
# actions, and the source the host dist is built from. A boxel branch paired
# with a catalog change is tested by passing its name as `boxel_ref`. A paired
# branch that is behind the called ref can lack a task or argument these steps
# use; merging main into it fixes that.
#
# A boxel PR that changes this workflow, the test web assets build, the subset
# manifest, its sync or the test helpers that read the sync's marker, or the CI
# boot path the stack comes up through (mise, the composite actions, the
# observability scripts and Traefik, as ci-host.yaml lists them) runs it too,
# against the pinned catalog revision, and so does the push that merges it. A
# change that would break the catalog's run is then red in boxel rather than on
# the next catalog PR.

on:
  workflow_call:
    inputs:
      boxel_ref:
        description: cardstack/boxel branch, tag or sha to test with
        required: true
        type: string
      catalog_ref:
        description: boxel-catalog branch, tag or sha to serve as the catalog test subset
        required: true
        type: string
  # The two lists below are the same; keep them in step.
  pull_request:
    paths:
      - ".github/workflows/catalog-test-subset-consumers.yml"
      - ".github/workflows/test-web-assets.yaml"
      - "packages/catalog/test-subset.json"
      - "packages/catalog/scripts/sync-test-subset.ts"
      # The only runs that take these helpers' local-checkout branch.
      - "packages/host/tests/helpers/catalog-test-subset.ts"
      - "packages/realm-server/tests/helpers/catalog-test-subset.ts"
      - ".mise.toml"
      - ".github/actions/**"
      - "mise-tasks/**"
      - "packages/observability/scripts/**"
      - "traefik/**"
  # Two PRs that each pass alone can still break the run together.
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-test-subset-consumers.yml"
      - ".github/workflows/test-web-assets.yaml"
      - "packages/catalog/test-subset.json"
      - "packages/catalog/scripts/sync-test-subset.ts"
      - "packages/host/tests/helpers/catalog-test-subset.ts"
      - "packages/realm-server/tests/helpers/catalog-test-subset.ts"
      - ".mise.toml"
      - ".github/actions/**"
      - "mise-tasks/**"
      - "packages/observability/scripts/**"
      - "traefik/**"

# Concurrency groups belong to the repository a run is in, so a boxel-catalog
# run of this workflow never shares one with a boxel PR's, even when the paired
# branches have the same name.
concurrency:
  group: catalog-test-subset-consumers-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the warm-test-images step pull the private GHCR mirror packages,
  # whose Actions access admits boxel-catalog as well as boxel, so the pull
  # works with the caller's token too. A caller has to grant it as well, since
  # a called workflow can't hold a permission its caller withholds.
  packages: read

jobs:
  plan:
    name: Read the subset's consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boxel_sha: ${{ steps.plan.outputs.boxel_sha }}
      catalog_repository: ${{ steps.plan.outputs.catalog_repository }}
      catalog_sha: ${{ steps.plan.outputs.catalog_sha }}
      host_filters: ${{ steps.plan.outputs.host_filters }}
      realm_server_files: ${{ steps.plan.outputs.realm_server_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cardstack/boxel
          ref: ${{ inputs.boxel_ref || github.sha }}
          sparse-checkout: packages/catalog/test-subset.json
          sparse-checkout-cone-mode: false

      # Both refs resolve to a sha here, and every job below checks out those
      # shas, so a branch that moves mid-run can't give one job a different
      # commit than another, or a host dist built from a different commit than
      # the tests that load it.
      - name: Resolve the commits under test
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_REF: ${{ inputs.catalog_ref }}
        run: |
          set -euo pipefail
          manifest=packages/catalog/test-subset.json
          boxel_sha=$(git rev-parse HEAD)
          catalog_repository=$(jq -r .repository "$manifest")
          # Run from this repository's own PRs and pushes, there is no caller
          # to name a catalog commit: test the pin, which is what boxel's CI
          # serves.
          catalog_ref="${CATALOG_REF:-$(jq -r .revision "$manifest")}"
          catalog_sha=$(gh api "repos/$catalog_repository/commits/$catalog_ref" --jq .sha)
          host_filters=$(jq -c '.tests.host // []' "$manifest")
          realm_server_files=$(jq -r '.tests.realmServer // [] | join(",")' "$manifest")
          echo "boxel $boxel_sha, $catalog_repository $catalog_sha"
          echo "host filters: $host_filters"
          echo "realm-server files: $realm_server_files"
          {
            echo "boxel_sha=$boxel_sha"
            echo "catalog_repository=$catalog_repository"
            echo "catalog_sha=$catalog_sha"
            echo "host_filters=$host_filters"
            echo "realm_server_files=$realm_server_files"
          } >> "$GITHUB_OUTPUT"

  # The host tests run against the env-mode stack (https://*.ci.localhost
  # behind Traefik), as ci-host.yaml's host-test does, and the realm-server
  # tests against the standard-mode stack, as ci.yaml's realm-server-test
  # does. Each needs a host dist with its own URLs baked in.
  host-web-assets:
    name: Build host test web assets
    needs: plan
    if: needs.plan.outputs.host_filters != '[]'
    uses: ./.github/workflows/test-web-assets.yaml
    with:
      caller: catalog-test-subset-consumers-host
      boxel_ref: ${{ needs.plan.outputs.boxel_sha }}
      skip_catalog: false
      boxel_environment: ci

  realm-server-web-assets:
    name: Build realm-server test web assets
    needs: plan
    if: needs.plan.outputs.realm_server_files != ''
    uses: ./.github/workflows/test-web-assets.yaml
    with:
      caller: catalog-test-subset-consumers-realm-server
      boxel_ref: ${{ needs.plan.outputs.boxel_sha }}

  host:
    name: Host tests
    needs: [plan, host-web-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOXEL_ENVIRONMENT: ci
      CATALOG_SOURCE: test-subset
      # Serve the subset from the catalog checkout below instead of the pin.
      CATALOG_TEST_SUBSET_SOURCE: packages/catalog/contents
      # See the same setting on ci-host.yaml's host-test: the cert exists only
      # once `actions/init` has run, so the conditional in env-vars.sh never
      # sets these.
      REALM_SERVER_TLS_CERT_FILE: /home/runner/.local/share/boxel/dev-certs/localhost.pem
      REALM_SERVER_TLS_KEY_FILE: /home/runner/.local/share/boxel/dev-certs/localhost-key.pem
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cardstack/boxel
          ref: ${{ needs.plan.outputs.boxel_sha }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.plan.outputs.catalog_repository }}
          ref: ${{ needs.plan.outputs.catalog_sha }}
          path: packages/catalog/contents
      - uses: ./.github/actions/init

      - name: Install mkcert root into system trust store
        run: mkcert -install
      - name: Start Traefik
        run: mise run infra:ensure-traefik

      - name: Download test web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-web-assets.outputs.artifact_name }}
          path: .test-web-assets-artifact
      - name: Restore test web assets into workspace
        shell: bash
        run: |
          shopt -s dotglob
          cp -a .test-web-assets-artifact/. ./

      # See the same step on ci-host.yaml's host-test.
      - name: Populate skills-realm content
        run: |
          set -eux
          cd packages/skills-realm
          if [ -d contents/Skill ]; then
            echo "skills content already present, skipping clone"
          else
            rm -rf contents
            git clone --depth=1 https://github.com/cardstack/boxel-skills.git contents
          fi

      # Warm the test images from the GHCR mirror so the services below start
      # from a local image instead of an unauthenticated Docker Hub pull.
      # Best-effort: a miss falls back to a hardened-retry Docker Hub pull.
      - name: Warm test Docker images from the GHCR mirror
        continue-on-error: true
        uses: ./.github/actions/warm-test-images

      - name: Start test services (icons + host dist + realm servers)
        run: |
          date +%s > /tmp/test-services.started
          mise run test-services:host | tee -a /tmp/server.log &
          echo $! > /tmp/test-services.pid

      - name: Create realm users
        run: pnpm register-realm-users
        working-directory: packages/matrix

      - name: Wait for realms and assert public-read parity
        run: |
          mise run ci:wait-for-realms \
            realm=https://realm-server.ci.localhost/base/ \
            realm=https://realm-server.ci.localhost/skills/ \
            realm=https://realm-server.ci.localhost/catalog/ \
            icons=https://icons.ci.localhost/@cardstack/boxel-icons/v1/icons/folder-pen.js \
            second-stage=https://realm-test.ci.localhost/test/ \
            stack-pid-file=/tmp/test-services.pid \
            stack-started-file=/tmp/test-services.started

      # No retry on transient fetch failures, unlike ci-host.yaml's shards:
      # the manifest's filters select a few modules rather than a shard of the
      # suite, so such a failure is rare here, and re-running the job recovers
      # from it.
      - name: Host tests the subset feeds
        working-directory: packages/host
        env:
          DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
          HOST_FILTERS: ${{ needs.plan.outputs.host_filters }}
        run: |
          status=0
          while IFS= read -r filter; do
            echo "::group::ember test --filter \"$filter\""
            dbus-run-session -- pnpm exec ember test --path ./dist --filter "$filter" || status=1
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$HOST_FILTERS")
          exit $status

      - name: Print realm server logs
        if: ${{ !cancelled() }}
        run: cat /tmp/server.log
      - name: Print Traefik diagnostics
        if: ${{ !cancelled() }}
        run: mise run ci:traefik-diagnostics

  realm-server:
    name: Realm-server tests
    needs: [plan, realm-server-web-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # test-services:realm-server serves the subset as the catalog realm;
      # this makes it the catalog checkout's copy, as on the host job.
      CATALOG_TEST_SUBSET_SOURCE: packages/catalog/contents
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cardstack/boxel
          ref: ${{ needs.plan.outputs.boxel_sha }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.plan.outputs.catalog_repository }}
          ref: ${{ needs.plan.outputs.catalog_sha }}
          path: packages/catalog/contents
      - uses: ./.github/actions/init

      - name: Download test web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.realm-server-web-assets.outputs.artifact_name }}
          path: .test-web-assets-artifact
      - name: Restore test web assets into workspace
        shell: bash
        run: |
          shopt -s dotglob
          cp -a .test-web-assets-artifact/. ./

      # As on the host job: best-effort, falling back to Docker Hub on a miss.
      - name: Warm test Docker images from the GHCR mirror
        continue-on-error: true
        uses: ./.github/actions/warm-test-images

      - name: Start test services (icons + host dist + realm servers)
        run: mise run test-services:realm-server | tee -a /tmp/server.log &

      - name: Create realm users
        run: pnpm register-realm-users
        working-directory: packages/matrix

      - name: Realm-server tests the subset feeds
        run: pnpm test:wait-for-servers
        working-directory: packages/realm-server
        env:
          TEST_FILES: ${{ needs.plan.outputs.realm_server_files }}

      - name: Print realm server logs
        if: ${{ !cancelled() }}
        run: cat /tmp/server.log
