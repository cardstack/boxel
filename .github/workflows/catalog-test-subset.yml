name: Catalog Test Subset

# Validates the catalog test subset declared in packages/catalog/test-subset.json:
# the pinned boxel-catalog revision must be on boxel-catalog's main, since the
# deployed catalog realm serves main and a pin main lacks describes
# definitions no deployment has; main must not have changed a subset file
# since the pin, or boxel's tests would run against a definition deployments
# no longer serve; and the pinned files must fetch and form a closed set a
# test stack can load.
#
# Path-scoped, so it runs only for PRs that change the subset or its tooling.

on:
  pull_request:
    paths:
      - "packages/catalog/test-subset.json"
      - "packages/catalog/scripts/sync-test-subset.ts"
      - ".github/workflows/catalog-test-subset.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog test subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            packages/catalog/test-subset.json
            packages/catalog/scripts/sync-test-subset.ts
            packages/host/app/lib/externals.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Pin is on boxel-catalog main and current with it
        run: node packages/catalog/scripts/sync-test-subset.ts --check-pin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pinned files fetch and form a closed set
        run: node packages/catalog/scripts/sync-test-subset.ts
