name: Observability — PR preview (production)

# Applies the per-PR dashboard preview to the PRODUCTION Grafana, and tears
# it down again when the PR closes.
#
# WHY THIS IS A SEPARATE WORKFLOW
#
# observability-preview.yml runs on `pull_request`. GitHub loads that file,
# and every script it calls, from the pull request's own merge ref — a
# contributor controls both. Giving it the production role would let any
# same-repository PR run arbitrary code with production credentials live and
# exfiltrate the temporary AWS credentials, the decrypted production
# grafanactl token, and GRAFANA_SECRET. It would also defeat the main-only
# guard in observability-apply-production.yml.
#
# GitHub always loads a `workflow_run` workflow from the default branch, no
# matter which branch the triggering run used. This file is therefore out of
# a pull request's reach, and it is the only place production credentials are
# safe to use for a preview.
#
# THE TRUST BOUNDARY
#
# The one thing this job takes from the pull request is the contents of
# packages/observability/grafanactl/resources — dashboard and folder
# manifests. Those are data, not code: nothing here executes them, and
# render-preview.sh (restored from the default branch, like every other
# script) rewrites every UID it emits to the `pr<n>-` form, so a crafted
# manifest cannot address a canonical production dashboard. The "Overlay"
# step below is what enforces that split; read it before changing it.

on:
  workflow_run:
    workflows: ["Observability — PR preview"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  # Serialize per branch: a force-push while a previous production apply is
  # mid-flight must not race it. Never cancel in-flight — that could leave
  # the production Grafana half-pushed.
  group: observability-preview-production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # The same narrowly-scoped role observability-apply-production.yml uses
  # (cardstack/infra#666). Permissions are ssm:GetParameter on the three
  # paths ci-apply-preview.sh reads for production.
  AWS_ROLE_ARN: arn:aws:iam::120317779495:role/boxel-observability-apply
  EXPECTED_GRAFANA_HOSTNAME: dashboard.boxel.ai
  PREVIEW_MARKER: "<!-- observability-preview -->"
  STAGING_GRAFANA_BASE_URL: "https://dashboard-staging.stack.cards"
  PRODUCTION_GRAFANA_BASE_URL: "https://dashboard.boxel.ai"

jobs:
  preview-production:
    name: Apply preview to production
    # Fork guard. `workflow_run` fires even when the triggering job itself
    # was skipped, so this has to be re-checked here rather than inherited.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the default branch
        # Trusted code. Everything this job executes comes from here; the
        # pull request's manifests are overlaid further down, after
        # grafanactl is already installed.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install grafanactl
        # Runs while the workspace still holds only default-branch code, so
        # this `uses: ./` cannot resolve to a pull-request-authored action.
        uses: ./.github/actions/install-grafanactl

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eo pipefail
          # Ask GitHub which PR this run belongs to rather than trusting
          # anything the triggering run produced. `workflow_run` does carry a
          # `pull_requests` array, but it is empty often enough that it can't
          # be relied on.
          pr_json="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.head.sha == env.HEAD_SHA)][0] // empty')"

          if [[ -z "$pr_json" ]]; then
            echo "No pull request found for ${HEAD_SHA} — nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$(jq -r '.number' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          state="$(jq -r '.state' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"

          # Second fork guard, on the PR record itself.
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "PR #${number} comes from ${head_repo} — refusing to touch production."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #${number}, base ${base_ref}, state ${state}"
          {
            echo "found=true"
            echo "number=${number}"
            echo "base_ref=${base_ref}"
            echo "state=${state}"
          } >> "$GITHUB_OUTPUT"

      - name: Overlay the pull request's dashboard manifests
        # THE TRUST BOUNDARY. After this step the working tree holds
        # default-branch code everywhere except
        # packages/observability/grafanactl/resources, which holds the pull
        # request's manifests. HEAD is the pull request's commit so that
        # render-preview.sh's `git diff <base>...HEAD` still sees the right
        # changed set.
        #
        # Skipped for a closed PR: teardown reads live Grafana state and
        # needs no manifests at all.
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.state == 'open'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -eo pipefail
          main_sha="$(git rev-parse HEAD)"

          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          git checkout --quiet --detach FETCH_HEAD

          # Restore every path this job executes or reads for configuration.
          # packages/observability covers the scripts and grafanactl/config.yaml
          # (which names the production server URL); .github covers any action
          # a later step might resolve through `uses: ./`.
          git checkout --quiet "$main_sha" -- .github packages/observability

          # ...then take back ONLY the manifests. This is the sole pull-request
          # input to the production push.
          git checkout --quiet FETCH_HEAD -- packages/observability/grafanactl/resources

          git fetch --no-tags origin "$PR_BASE_REF"

          echo "Overlaid manifests from PR #${PR_NUMBER} onto ${main_sha}."

      - name: Pre-flight — assert config.yaml's production server URL
        # Runs before any credential is fetched. config.yaml comes from the
        # default branch (restored above), so this catches a config-as-code
        # mistake rather than a hostile edit — but it is the check that makes
        # "the token can only go to the real production Grafana" verifiable.
        #
        # The awk uses an in-block flag rather than awk's range syntax
        # (`/start/,/end/`), because `/^  production:$/,/^  [a-z]/` would
        # match only the start line — the end pattern `^  [a-z]` matches the
        # start line itself, terminating the range immediately.
        if: steps.pr.outputs.found == 'true'
        working-directory: packages/observability
        run: |
          set -eo pipefail
          ACTUAL="$(awk '
            /^  production:$/      { in_prod=1; next }
            in_prod && /^  [a-z]/  { exit }
            in_prod && /^      server:/ { print $2; exit }
          ' grafanactl/config.yaml)"
          echo "config.yaml production server: $ACTUAL"
          echo "expected:                       https://${EXPECTED_GRAFANA_HOSTNAME}"
          if [[ "$ACTUAL" != "https://${EXPECTED_GRAFANA_HOSTNAME}" ]]; then
            echo "::error::config.yaml's production context server URL doesn't match expected hostname." >&2
            echo "If this is an intentional rename, update EXPECTED_GRAFANA_HOSTNAME in this workflow to match." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        if: steps.pr.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply preview
        id: apply
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.state == 'open'
        working-directory: packages/observability
        env:
          ENV_NAME: production
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: ./scripts/ci-apply-preview.sh

      - name: Cleanup preview
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.state == 'closed'
        working-directory: packages/observability
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: ./scripts/cleanup-preview.sh --pr "$PR_NUMBER" --env production

      - name: Rewrite the sticky PR comment
        # observability-preview.yml already posted a staging-only sticky.
        # Replace it with one covering both environments. The preview UIDs and
        # titles are environment-independent — render-preview.sh varies only
        # the apply-time substitutions — so this job's own summary describes
        # the staging resources just as well as the production ones.
        if: steps.pr.outputs.found == 'true' && steps.pr.outputs.state == 'open'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUT_FILE: ${{ steps.apply.outputs.out_file }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          STAGING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STAGING_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.PREVIEW_MARKER;
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const outFile = process.env.OUT_FILE;
            const raw = outFile && fs.existsSync(outFile)
              ? fs.readFileSync(outFile, 'utf8').trim()
              : '';

            if (!raw) {
              // This HEAD changes no dashboards, so there is nothing to link
              // and the staging job already removed any stale sticky.
              core.info('No dashboard changes — leaving the comment alone.');
              return;
            }

            const folders = [];
            const dashboards = [];
            for (const line of raw.split('\n')) {
              // Format: `<KIND>:<uid>:<title>` (title may contain `:`).
              const m = line.match(/^(FOLDER|DASHBOARD):([^:]+):(.*)$/);
              if (!m) continue;
              const [, kind, uid, title] = m;
              (kind === 'FOLDER' ? folders : dashboards).push({ uid, title });
            }

            const stagingOk = process.env.STAGING_CONCLUSION === 'success';
            const environments = [
              ...(stagingOk
                ? [{ name: 'staging', baseUrl: process.env.STAGING_GRAFANA_BASE_URL }]
                : []),
              { name: 'production', baseUrl: process.env.PRODUCTION_GRAFANA_BASE_URL },
            ];

            const links = (path) =>
              environments
                .map(e => `[${e.name}](${e.baseUrl}${path})`)
                .join(' · ');

            const folderLines = folders.map(
              f => `- **Folder:** ${f.title} — ${links(`/dashboards/f/${f.uid}/`)}`,
            );
            const dashboardLines = dashboards.map(
              d => `- ${d.title} — ${links(`/d/${d.uid}/`)}`,
            );

            const warning = stagingOk
              ? []
              : [
                  '',
                  '> [!WARNING]',
                  `> The **staging** preview did not apply — see [its run](${process.env.STAGING_RUN_URL}). Only the production links are listed.`,
                ];

            const envNames = environments.map(e => e.name).join(' and ');

            const body = [
              marker,
              '## Grafana preview',
              '',
              `Preview deployed for **${dashboards.length} dashboard${dashboards.length === 1 ? '' : 's'}** in ${envNames}.`,
              "Cross-dashboard drill-throughs still point at each environment's canonical dashboards.",
              ...warning,
              '',
              ...folderLines,
              '',
              '**Dashboards:**',
              ...dashboardLines,
              '',
              'Previews are torn down automatically when this PR is closed or merged.',
              '',
              `_(Run: ${runUrl})_`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              },
            );
            const existing = comments.find(
              c => c.body && c.body.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated sticky comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created sticky comment');
            }
