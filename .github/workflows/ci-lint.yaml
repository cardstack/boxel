name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    # Observability has its own lint workflow (observability-diff.yml's
    # `lint` job) that runs the full lint script — including the prettier
    # YAML check. Skipping ci-lint on observability-only PRs avoids ~5 min
    # of unrelated lint work; coverage on observability changes lives in
    # the dedicated workflow. Deny-list rather than allow-list so adding
    # a new package automatically gets linted (the inverse failure mode —
    # silently skipping lint for a new package — is worse).
    paths-ignore:
      - "packages/observability/**"

# Pull requests: a new push cancels the run in progress for the same branch.
# Pushes to main share one group but never cancel a run in progress: GitHub
# keeps at most one running and one pending run per group, and a newer pending
# run replaces the older one. A burst of merges therefore runs the commit in
# progress and then the newest, rather than every commit in between.
# The main group is `push:main` because `:` cannot appear in a branch name, so
# no pull request's head_ref (a fork's `main`, say) can land in it and cancel a
# main run.
concurrency:
  group: ci-lint-${{ github.head_ref || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'push:main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lint-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/init

      - name: Lint Boxel Icons
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-icons
      - name: Restore boxel-icons build cache
        id: icons-cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/restore-icons-cache
      - name: Build Boxel Icons
        # To faciliate linting of projects that depend on Boxel Icons
        if: ${{ !cancelled() && steps.icons-cache.outputs.cache-hit != 'true' }}
        run: pnpm run build
        working-directory: packages/boxel-icons
      - name: Lint Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui
      - name: Lint Host
        # Runs BEFORE Build Boxel UI so host type-checks against the Boxel UI
        # source, exactly as local development does (declarations/ is never
        # built locally). This also guards against declaration-emit
        # regressions: an unresolvable import inside a .d.ts is silently
        # suppressed under skipLibCheck and degrades every Boxel UI symbol to
        # `any`, turning the host type check into a no-op (the emitted
        # declaration import specifiers are rewritten by addon.declarations()
        # in boxel-ui's rollup.config.mjs).
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/host
      - name: Build Boxel UI
        # To faciliate linting of projects that depend on Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run build
        working-directory: packages/boxel-ui
      - name: Lint Boxel UI Test App
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui/docs-app
      - name: Lint Matrix
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/matrix
      - name: Lint Realm Server
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-server
      - name: Lint Realm Test Harness
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-test-harness
      - name: Lint Runtime Common
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/runtime-common
      - name: Lint Billing
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/billing
      - name: Lint Postgres
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/postgres
      - name: Lint Base Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/base
      - name: Lint Experiments Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/experiments-realm
      - name: Lint Pret UI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/pretui
      - name: Lint Software Factory
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/software-factory
      - name: Lint Boxel Tools VS Code extension
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/vscode-boxel-tools
      - name: Lint ESLint Plugin
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/eslint-plugin-boxel
      - name: Lint AI Bot
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/ai-bot
      - name: Lint AI Assistant Evals
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/ai-assistant-evals
      - name: Lint Bot Runner
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bot-runner
      - name: Lint Boxel CLI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-cli
      - name: Lint BXL
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bxl
      - name: Lint Glimmer Motion
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/glimmer-motion
      - name: Lint Choreo Player
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-player
      - name: Build Glimmer Motion and Choreo Player
        # The Choreo gallery and test app type-check against these packages'
        # built output (package.json#exports maps types into declarations/).
        if: ${{ !cancelled() }}
        run: |
          (cd packages/glimmer-motion && pnpm run build)
          (cd packages/choreo-player && pnpm run build)
      - name: Lint Choreo Test App
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-test-app
      - name: Build Choreo Gallery
        # The gallery's build copies its demos in from the test app; lint and
        # type-check run against those copies.
        if: ${{ !cancelled() }}
        run: pnpm run build
        working-directory: packages/choreo-gallery
      - name: Lint Choreo Gallery
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-gallery

  catalog:
    # The catalog (cardstack/boxel-catalog) type-checks and lints its cards
    # against boxel, so a platform change can break the catalog's lint while
    # everything here passes. This lints the catalog against this change, the
    # way the catalog's own CI Lint does, and fails on the errors the change
    # introduces, including the ones a paired change leaves catalog main with
    # until its catalog pull request merges. See packages/catalog/README.md.
    name: Lint Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base branch the catalog may also be linted against below.
          fetch-depth: 2

      # A boxel-catalog branch with the same name as this pull request's
      # branch is the catalog change this one depends on, so lint that instead
      # of main and the two validate together before either merges.
      - name: Pick the catalog ref
        id: ref
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          ref=main
          paired=false
          # A bare name would also match any ref ending in /<name>. A fork's
          # main is not a catalog change of its own, so it lints main as is.
          if [ -n "$BRANCH" ] && [ "$BRANCH" != main ] &&
            git ls-remote --exit-code https://github.com/cardstack/boxel-catalog.git "refs/heads/$BRANCH" >/dev/null; then
            ref="$BRANCH"
            paired=true
            echo "::notice title=catalog lint::Linting boxel-catalog branch $ref, which matches this branch's name, in place of main. Catalog main is linted against this change too: if this change breaks it, that branch's catalog pull request must be approved, to merge right after this one."
          fi
          echo "Linting boxel-catalog@$ref"
          echo "catalog_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "paired=$paired" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cardstack/boxel-catalog
          ref: ${{ steps.ref.outputs.catalog_ref }}
          path: packages/catalog/contents

      - uses: ./.github/actions/init

      # Restore only: the base-branch step below can rebuild boxel-icons from
      # the base tree, which must not be saved under this change's key.
      - name: Restore boxel-icons build cache
        id: icons-cache
        uses: ./.github/actions/restore-icons-cache
        with:
          save: "false"
      - name: Build Boxel Icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: pnpm run build
        working-directory: packages/boxel-icons
      # The catalog's CI Lint builds Boxel UI before linting, so its type check
      # reads Boxel UI's declarations; build it here to check the same thing.
      - name: Build Boxel UI
        run: pnpm run build
        working-directory: packages/boxel-ui

      - name: Lint the catalog against this change
        id: head
        working-directory: packages/catalog
        run: |
          node scripts/lint-sweep.ts --record="$RUNNER_TEMP/catalog-lint-head.json"
          echo "errors=$(jq '.diagnostics | length' "$RUNNER_TEMP/catalog-lint-head.json")" >> "$GITHUB_OUTPUT"
          # The base branch's tree may not have this script.
          cp scripts/lint-sweep.ts "$RUNNER_TEMP/lint-sweep.ts"

      # A paired change is linted with its catalog branch, but if it merges
      # before that branch's pull request, catalog main is what gets linted
      # against it until then. So lint catalog main against the change too,
      # then put the paired branch back for the base-branch step.
      - name: Lint catalog main against this change
        id: main
        if: steps.ref.outputs.paired == 'true'
        working-directory: packages/catalog
        run: |
          paired=$(git -C contents rev-parse HEAD)
          git -C contents fetch --quiet --depth=1 origin main
          git -C contents checkout --quiet --detach FETCH_HEAD
          echo "revision=$(git -C contents rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/lint-sweep.ts --record="$RUNNER_TEMP/catalog-main-lint-head.json"
          echo "errors=$(jq '.diagnostics | length' "$RUNNER_TEMP/catalog-main-lint-head.json")" >> "$GITHUB_OUTPUT"
          git -C contents checkout --quiet --detach "$paired"

      # Errors the catalog also has against the base branch are not this
      # change's doing: the catalog may already be broken against boxel main.
      # So when this change's lint finds errors, lint the same catalog revision
      # against the base branch, and the report counts only the difference.
      # Catalog main, when it was linted above, gets the same comparison.
      # A push to main has no base to compare with, so every error counts.
      - name: Lint the catalog against the base branch
        id: base
        if: github.event_name == 'pull_request' && (steps.head.outputs.errors != '0' || (steps.main.outputs.errors || '0') != '0')
        env:
          HEAD_ERRORS: ${{ steps.head.outputs.errors }}
          MAIN_ERRORS: ${{ steps.main.outputs.errors || '0' }}
          MAIN_REVISION: ${{ steps.main.outputs.revision }}
        run: |
          head=$(git rev-parse HEAD)
          git checkout --detach HEAD^1
          pnpm install --frozen-lockfile
          # This change's builds stay in place when the base builds the same.
          if ! git diff --quiet HEAD "$head" -- packages/boxel-icons packages/boxel-ui pnpm-lock.yaml; then
            (cd packages/boxel-icons && pnpm run build)
            (cd packages/boxel-ui && pnpm run build)
          fi
          cd packages/catalog
          if [ "$HEAD_ERRORS" != 0 ]; then
            node "$RUNNER_TEMP/lint-sweep.ts" --record="$RUNNER_TEMP/catalog-lint-base.json"
          fi
          if [ "$MAIN_ERRORS" != 0 ]; then
            git -C contents checkout --quiet --detach "$MAIN_REVISION"
            node "$RUNNER_TEMP/lint-sweep.ts" --record="$RUNNER_TEMP/catalog-main-lint-base.json"
          fi

      # A failed catalog main lint skips the base step, and without its baseline
      # this report would count errors the catalog already has as new ones.
      - name: Report catalog lint errors
        if: ${{ !cancelled() && steps.head.outcome == 'success' && steps.main.outcome != 'failure' && steps.base.outcome != 'failure' }}
        run: |
          baseline=()
          if [ -f "$RUNNER_TEMP/catalog-lint-base.json" ]; then
            baseline=(--baseline="$RUNNER_TEMP/catalog-lint-base.json")
          fi
          node "$RUNNER_TEMP/lint-sweep.ts" --report="$RUNNER_TEMP/catalog-lint-head.json" "${baseline[@]}"

      # Errors this change adds to catalog main stay there from this change's
      # merge until the paired branch's pull request merges, so they pass only
      # while that pull request is approved, to merge right after this one.
      - name: Report what this change does to catalog main
        if: ${{ !cancelled() && steps.main.outcome == 'success' && steps.base.outcome != 'failure' }}
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=()
          if [ -f "$RUNNER_TEMP/catalog-main-lint-base.json" ]; then
            baseline=(--baseline="$RUNNER_TEMP/catalog-main-lint-base.json")
          fi
          node "$RUNNER_TEMP/lint-sweep.ts" --report="$RUNNER_TEMP/catalog-main-lint-head.json" "${baseline[@]}" --pair="$BRANCH"
