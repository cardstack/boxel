name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    # Observability has its own lint workflow (observability-diff.yml's
    # `lint` job) that runs the full lint script — including the prettier
    # YAML check. Skipping ci-lint on observability-only PRs avoids ~5 min
    # of unrelated lint work; coverage on observability changes lives in
    # the dedicated workflow. Deny-list rather than allow-list so adding
    # a new package automatically gets linted (the inverse failure mode —
    # silently skipping lint for a new package — is worse).
    paths-ignore:
      - "packages/observability/**"

concurrency:
  group: ci-lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lint-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/init

      - name: Type-check repo-root scripts
        # The root `lint` script filters to ./packages/**, so scripts/ is
        # outside every package's tsconfig. This is what type-checks the TS
        # tools there — including erasableSyntaxOnly, since node executes them
        # by stripping types and would reject syntax needing runtime emit.
        if: ${{ !cancelled() }}
        run: pnpm run lint:scripts
      - name: Check rendering-protocol statement/test bijection
        # RP-0.3: a conformance test citing a statement the spec does not make
        # fails the build. The reverse direction — a statement with no test —
        # is a ratchet: the uncovered count may not rise. Both become hard
        # zeros under `--strict`, which is the gate for the spec reaching
        # NORMATIVE status.
        if: ${{ !cancelled() }}
        run: pnpm run lint:rp-bijection

      - name: Check the execution protocol's runtime import closure
        if: ${{ !cancelled() }}
        run: pnpm run lint:protocol-closure
      - name: Check every execution tier is registered for record parity
        # RP-14.4: the parity harness compares the tiers it is handed, so an
        # adapter nobody registered is not a failing comparison but an absent
        # one. This holds the set of BoxelRuntime implementations equal to the
        # set the harness knows about.
        if: ${{ !cancelled() }}
        run: pnpm run lint:tier-registry
      - name: Check every package declaring content-tag resolves one copy
        # Several packages preprocess authored `<template>` source with
        # content-tag — the realm with runtime-common's copy, the Host's module
        # classifier with host's — and two versions read the compiled form
        # differently, which shows up as servable modules classifying as drafts,
        # whose module graph is empty and is the whole of a sandboxed render's
        # fetch authority. boxel-cli's build adds a second way to get this
        # wrong: it bundles its own copy's JavaScript glue and copies the wasm
        # binary beside it, so a divergence ships the two halves mismatched.
        # The host suite bundles two of those copies and would catch a
        # behavioral divergence between them incidentally; the declaration
        # drifting, and a divergence in a package no suite bundles both sides
        # of, are what this holds.
        if: ${{ !cancelled() }}
        run: pnpm run lint:content-tag-parity
      - name: Check execution-runtime evidence manifests and smoke runner
        # The wild-corpus and mirror-cohort manifests are executable, so their
        # shape (fifty unique cards, ten numbered scenarios, every evidence
        # plane covered) is enforced rather than described. The runner tests
        # cover the batch properties a real browser run cannot check cheaply:
        # per-case persistence, per-case cancellation, and the two-part
        # readiness record. Pure Node with no services, so it belongs here.
        if: ${{ !cancelled() }}
        run: pnpm run test:execution-runtime-evidence
        working-directory: packages/host
      - name: Lint Boxel Icons
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-icons
      - name: Restore boxel-icons build cache
        id: icons-cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/restore-icons-cache
      - name: Build Boxel Icons
        # To faciliate linting of projects that depend on Boxel Icons
        if: ${{ !cancelled() && steps.icons-cache.outputs.cache-hit != 'true' }}
        run: pnpm run build
        working-directory: packages/boxel-icons
      - name: Lint Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui
      - name: Lint Host
        # Runs BEFORE Build Boxel UI so host type-checks against the Boxel UI
        # source, exactly as local development does (declarations/ is never
        # built locally). This also guards against declaration-emit
        # regressions: an unresolvable import inside a .d.ts is silently
        # suppressed under skipLibCheck and degrades every Boxel UI symbol to
        # `any`, turning the host type check into a no-op (the emitted
        # declaration import specifiers are rewritten by addon.declarations()
        # in boxel-ui's rollup.config.mjs).
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/host
      - name: Build Boxel UI
        # To faciliate linting of projects that depend on Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run build
        working-directory: packages/boxel-ui
      - name: Lint Boxel UI Test App
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui/docs-app
      - name: Lint Matrix
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/matrix
      - name: Lint Realm Server
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-server
      - name: Lint Realm Test Harness
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-test-harness
      - name: Lint Runtime Common
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/runtime-common
      - name: Lint Billing
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/billing
      - name: Lint Postgres
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/postgres
      - name: Lint Base Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/base
      - name: Lint Experiments Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/experiments-realm
      - name: Lint Software Factory
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/software-factory
      - name: Lint Boxel Tools VS Code extension
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/vscode-boxel-tools
      - name: Lint ESLint Plugin
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/eslint-plugin-boxel
      - name: Lint AI Bot
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/ai-bot
      - name: Lint Bot Runner
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bot-runner
      - name: Lint Boxel CLI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-cli
      - name: Lint BXL
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bxl
