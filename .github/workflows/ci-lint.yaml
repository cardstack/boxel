name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs Lint on the commit that would land: the queued pull
  # request merged onto main and onto every pull request ahead of it. Two pull
  # requests can each pass Lint on their own base and still fail it together,
  # as when one trims the secure origin's import allowlist and another starts
  # reaching a package the trim removed. Lint is a required check, so main
  # takes only a merge whose merged result passes it.
  merge_group:
  # Motion Bump (motion-bump.yml) dispatches this on the branches it opens,
  # whose pull requests start no pull_request workflows.
  workflow_dispatch:

# Pull requests: a new push cancels the run in progress for the same branch.
# A merge group's run has a group of its own, so no push cancels it.
# Pushes to main share one group but never cancel a run in progress: GitHub
# keeps at most one running and one pending run per group, and a newer pending
# run replaces the older one. A burst of merges therefore runs the commit in
# progress and then the newest, rather than every commit in between.
# The main group is `push:main` because `:` cannot appear in a branch name, so
# no pull request's head_ref (a fork's `main`, say) can land in it and cancel a
# main run.
concurrency:
  group: ci-lint-${{ github.head_ref || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'push:main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Observability has its own lint (observability-diff.yml's `Lint
  # Observability` job), so a pull request that touches nothing else skips
  # Lint here. The skip is decided in a job rather than with `paths-ignore`:
  # Lint is a required check, and a workflow a path filter never starts leaves
  # its required check pending forever, while a skipped job passes it. The
  # filter is a deny-list, so a new package is linted without a change here.
  # Only pull requests are filtered; a merge group, a push to main and a hand
  # run always lint everything.
  changes:
    name: Check whether Lint applies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            lint:
              - '**'
              - '!packages/observability/**'

  lint:
    name: Lint
    needs: changes
    # Runs unless the filter ran and found only observability changes. When
    # the filter didn't run (any event but a pull request) or failed, Lint
    # runs: a failed filter must not skip a required check, which would pass
    # it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: lint-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/init

      - name: Check docs/ holds only linked docs and ADRs
        run: node scripts/check-docs-dir.mts

      - name: Check env-vars.sh asks mkcert only when it has to
        if: ${{ !cancelled() }}
        run: node scripts/check-env-vars-mkcert.mts

      - name: Lint Boxel Icons
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-icons
      - name: Restore boxel-icons build cache
        id: icons-cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/restore-icons-cache
      - name: Build Boxel Icons
        # To faciliate linting of projects that depend on Boxel Icons
        if: ${{ !cancelled() && steps.icons-cache.outputs.cache-hit != 'true' }}
        run: pnpm run build
        working-directory: packages/boxel-icons
      - name: Lint Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui
      - name: Lint Host
        # Runs BEFORE Build Boxel UI so host type-checks against the Boxel UI
        # source, exactly as local development does (declarations/ is never
        # built locally). This also guards against declaration-emit
        # regressions: an unresolvable import inside a .d.ts is silently
        # suppressed under skipLibCheck and degrades every Boxel UI symbol to
        # `any`, turning the host type check into a no-op (the emitted
        # declaration import specifiers are rewritten by addon.declarations()
        # in boxel-ui's rollup.config.mjs).
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/host
      - name: Build Boxel UI
        # To faciliate linting of projects that depend on Boxel UI
        if: ${{ !cancelled() }}
        run: pnpm run build
        working-directory: packages/boxel-ui
      - name: Lint Boxel UI Test App
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-ui/docs-app
      - name: Lint Matrix
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/matrix
      - name: Lint Realm Server
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-server
      - name: Lint Secure Origin
        # Includes rebuilding the secure origin's pages: the build fails on any
        # module outside the package's import allowlist, and on any difference
        # from the committed build-record.json. The unit tests pin what the
        # allowlist refuses. The components' suite runs in ci.yaml.
        if: ${{ !cancelled() }}
        run: pnpm run lint && pnpm test:unit
        working-directory: packages/secure-origin
      - name: Lint Realm Test Harness
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/realm-test-harness
      - name: Lint Runtime Common
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/runtime-common
      - name: Lint Billing
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/billing
      - name: Lint Postgres
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/postgres
      - name: Lint Base Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/base
      - name: Lint Experiments Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/experiments-realm
      - name: Lint School Example Realm
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/school-example-realm
      - name: Lint Test Realm Cards
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/test-realm-cards
      - name: Lint Pret UI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/pretui
      - name: Lint Software Factory
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/software-factory
      - name: Lint Boxel Tools VS Code extension
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/vscode-boxel-tools
      - name: Lint ESLint Plugin
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/eslint-plugin-boxel
      - name: Lint AI Bot
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/ai-bot
      - name: Lint AI Assistant Evals
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/ai-assistant-evals
      - name: Lint Bot Runner
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bot-runner
      - name: Lint Boxel CLI
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/boxel-cli
      - name: Lint BXL
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/bxl
      - name: Lint Choreo ESLint Config
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-eslint-config
      - name: Lint Glimmer Motion
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/glimmer-motion
      - name: Lint Choreo
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo
      - name: Lint Choreo Player
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-player
      - name: Lint Choreo Gallery
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-gallery
      - name: Lint Choreo Film App
        if: ${{ !cancelled() }}
        run: pnpm run lint
        working-directory: packages/choreo-film-app
