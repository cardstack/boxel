name: Build Test Web Assets

on:
  workflow_call:
    inputs:
      caller:
        description: Unique identifier for the calling workflow (used in concurrency group to prevent cross-workflow cancellation)
        required: true
        type: string
      skip_catalog:
        description: Build host test assets with catalog skipped
        required: false
        type: boolean
        default: false
      boxel_environment:
        description: |
          BOXEL_ENVIRONMENT slug to bake into the host dist. Empty for
          a standard-mode build (URLs like https://localhost:4201);
          a value like "ci" produces an env-mode build whose realm URLs
          target the per-environment Traefik hostnames
          (https://realm-server.ci.localhost, etc.). The slug is folded
          into the cache key and artifact name so standard-mode and
          env-mode builds don't collide.
        required: false
        type: string
        default: ""
      boxel_ref:
        description: |
          cardstack/boxel branch, tag or sha to build, for a caller whose
          run was triggered from another repository (boxel-catalog runs
          boxel's tests against its own changes), where the triggering
          commit is not a boxel commit. Empty builds the triggering commit.
          The cache key and artifact name use the commit actually built,
          so either way they identify the assets.
        required: false
        type: string
        default: ""
      runs_on_spec:
        description: |
          RunsOn spec (e.g. `cpu=4/ram=16/family=m8i+m7i/image=ubuntu24-full-x64`)
          to build on an ephemeral EC2 runner in our AWS account instead of
          ubuntu-latest. Empty builds on ubuntu-latest. The caller decides
          whether a run may use RunsOn at all, including keeping fork PRs off
          it; see host-test in ci-host.yaml.
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: Artifact name containing built test web assets
        value: ${{ jobs.build.outputs.artifact_name }}
      cache_key:
        description: Cache key used for the built assets
        value: ${{ jobs.build.outputs.cache_key }}
      cache_hit:
        description: Whether the cache was hit
        value: ${{ jobs.build.outputs.cache_hit }}

jobs:
  build:
    name: Build and cache test web assets
    # The caller is in the label because one run can call this workflow more
    # than once (catalog-test-subset-consumers does), and RunsOn needs a label
    # unique to each job.
    runs-on: ${{ inputs.runs_on_spec && format('runs-on={0}-web-assets-{1}/{2}', github.run_id, inputs.caller, inputs.runs_on_spec) || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: test-web-assets-${{ inputs.caller }}-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false

    outputs:
      artifact_name: ${{ steps.keys.outputs.artifact_name }}
      cache_key: ${{ steps.keys.outputs.cache_key }}
      cache_hit: ${{ steps.restore.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.boxel_ref && 'cardstack/boxel' || github.repository }}
          ref: ${{ inputs.boxel_ref }}
      - uses: ./.github/actions/init

      - name: Compute cache key
        id: keys
        shell: bash
        run: |
          ref_slug="$(echo "${GITHUB_REF}" | tr '/' '_')"
          sha="$(git rev-parse HEAD)"
          skip_catalog="${{ inputs.skip_catalog }}"
          boxel_env="${{ inputs.boxel_environment }}"
          # An empty boxel_environment encodes the standard-mode build;
          # any non-empty slug produces a distinct artifact + cache entry
          # so env-mode and standard-mode builds for the same SHA coexist.
          env_suffix="${boxel_env:-std}"
          cache_key="test-web-assets-v2-${RUNNER_OS}-${ref_slug}-${sha}-skip-catalog-${skip_catalog}-env-${env_suffix}"
          artifact_name="test-web-assets-${sha}-skip-catalog-${skip_catalog}-env-${env_suffix}"
          {
            echo "sha=$sha"
            echo "cache_key=$cache_key"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached assets
        id: restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: ${{ steps.keys.outputs.cache_key }}
          path: |
            packages/boxel-icons/dist
            packages/boxel-ui/dist
            packages/host/dist
            .ci/test-web-assets/manifest.json

      - name: Restore boxel-icons build cache
        id: icons-cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-icons-cache
      - name: Build boxel-icons and boxel-ui
        if: steps.restore.outputs.cache-hit != 'true'
        run: mise run build:ui
        env:
          SKIP_ICONS_BUILD: ${{ steps.icons-cache.outputs.cache-hit }}

      - name: Build host dist (test assets)
        if: steps.restore.outputs.cache-hit != 'true'
        run: NODE_OPTIONS="--max_old_space_size=4096" pnpm build
        working-directory: packages/host
        env:
          SKIP_CATALOG: ${{ inputs.skip_catalog }}
          # When set, environment.js bakes the env-mode realm/matrix/icons
          # URLs (https://realm-server.<slug>.localhost, etc.) into the
          # vite chunks. Empty preserves the standard-mode defaults.
          BOXEL_ENVIRONMENT: ${{ inputs.boxel_environment }}

      - name: Write assets manifest
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          fs.mkdirSync(".ci/test-web-assets", { recursive: true });
          const manifest = {
            sha: process.env.BUILT_SHA,
            ref: process.env.GITHUB_REF,
            runnerOs: process.env.RUNNER_OS,
            node: process.version,
            pnpm: require("child_process").execSync("pnpm -v").toString().trim(),
            cacheKey: process.env.CACHE_KEY,
            cacheHit: process.env.CACHE_HIT === "true",
            skipCatalog: process.env.SKIP_CATALOG === "true",
            boxelEnvironment: process.env.BOXEL_ENVIRONMENT || null,
            builtAt: new Date().toISOString(),
          };
          fs.writeFileSync(".ci/test-web-assets/manifest.json", JSON.stringify(manifest, null, 2));
          '
        env:
          BUILT_SHA: ${{ steps.keys.outputs.sha }}
          CACHE_KEY: ${{ steps.keys.outputs.cache_key }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          SKIP_CATALOG: ${{ inputs.skip_catalog }}
          BOXEL_ENVIRONMENT: ${{ inputs.boxel_environment }}

      - name: Save cached assets
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          key: ${{ steps.keys.outputs.cache_key }}
          path: |
            packages/boxel-icons/dist
            packages/boxel-ui/dist
            packages/host/dist
            .ci/test-web-assets/manifest.json

      - name: Upload built assets
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: ${{ steps.keys.outputs.artifact_name }}
          path: |
            packages/boxel-icons/dist
            packages/boxel-ui/dist
            packages/host/dist
            .ci/test-web-assets/manifest.json
          retention-days: 7
