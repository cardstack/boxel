name: Realm Deployment Self-Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/realm-deployment/**"
      - ".github/workflows/realm-deployment-test.yml"

permissions:
  contents: read

jobs:
  start:
    name: Finds the revisions a realm may hold and the push arguments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Runs against a scratch repository with `gh` and `boxel` stubbed, so it
      # reads no real deployments and pushes nothing.
      - name: Test start.sh
        run: bash .github/actions/realm-deployment/start.test.sh

      - name: Shellcheck
        run: shellcheck .github/actions/realm-deployment/*.sh
