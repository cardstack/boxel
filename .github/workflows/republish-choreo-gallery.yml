name: Republish the Choreo gallery

# choreo.boxel.site serves a published copy of the production gallery realm
# (https://app.boxel.ai/choreo-gallery/), taken when it was last published. A
# production deploy updates the realm but not that copy, and the copy's cards
# run against the glimmer-motion and Choreo the newly deployed host serves.
# Manual Deploy [boxel] calls this after every production release so the copy
# keeps up with both. Run it by hand to republish without a deploy.
#
# It signs in as choreo_gallery_writer, which can write the realm but doesn't
# own it, and publishes through packages/choreo-gallery/scripts/republish.sh.
# See "Where it's served" in packages/choreo-gallery/README.md.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  republish:
    name: Republish choreo.boxel.site
    runs-on: ubuntu-latest
    # A publish that is already running finishes on the server whether or not
    # this job waits for it, so a newer run queues behind it rather than
    # cancelling it.
    concurrency:
      group: republish-choreo-gallery
      cancel-in-progress: false
    # The script waits up to 120 minutes for the realm's index and up to 60 for
    # the published copy.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: packages/choreo-gallery/scripts

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install Boxel CLI
        run: npm install -g @cardstack/boxel-cli@0.9.0-unstable.1

      - name: Sign in as choreo_gallery_writer
        env:
          # Read from the environment rather than passed with -p, so the
          # password never appears in the process list.
          BOXEL_PASSWORD: ${{ secrets.CHOREO_GALLERY_WRITER_PRODUCTION_PASSWORD }}
        run: |
          if [ -z "$BOXEL_PASSWORD" ]; then
            echo "::error title=Choreo gallery not republished::The CHOREO_GALLERY_WRITER_PRODUCTION_PASSWORD secret isn't set in cardstack/boxel. Save choreo_gallery_writer's production password (from the team password manager) under that name."
            exit 1
          fi
          boxel profile add --user @choreo_gallery_writer:boxel.ai

      - name: Republish
        run: packages/choreo-gallery/scripts/republish.sh
