name: PR preview realm (reusable)

# Reusable workflow that consumer repos (currently boxel-home; any repo
# wanting per-PR previews) call to create/update/delete a published
# realm tied to a pull request. Two jobs:
#   deploy  - on pull_request open/synchronize/reopened
#   cleanup - on pull_request closed, or when the caller sets unpublish
#
# Caller passes the per-repo realm-server, matrix, and published-realm
# coordinates; this workflow handles boxel-cli profile setup, create-
# if-absent + push + publish, and the sticky PR comment lifecycle.

on:
  workflow_call:
    inputs:
      realm-server-url:
        description: |
          Realm-server URL (trailing slash optional). The source realm
          will live at `${realm-server-url}/${matrix-username}/${realm-endpoint-prefix}${pr-number}/`.
        type: string
        required: true
      matrix-url:
        type: string
        required: true
      published-realm-base:
        description: |
          Base URL the realm will be published at, without realm-name
          segment. E.g. `https://${user}.staging.boxel.dev`. Must satisfy
          the realm-server's `domainsForPublishedRealms` allow-list.
        type: string
        required: true
      realm-endpoint-prefix:
        description: |
          Prefix combined with the PR number to form the per-PR realm
          name, e.g. `boxel-home-pr-`. Lowercase letters/digits/hyphens.
        type: string
        required: true
      display-name-prefix:
        description: |
          Human-readable label prefix shown in the realm picker. The
          full display name will be `${display-name-prefix} #${pr-number} Preview`.
        type: string
        default: PR
      sticky-header:
        description: |
          Header used by marocchino/sticky-pull-request-comment to
          dedupe the sticky comment across runs.
        type: string
        default: boxel-preview-realm
      boxel-cli-version:
        type: string
        default: latest
      paths:
        description: |
          Newline-separated files and directories, relative to the
          repository root, to push in place of the whole repository. The
          realm mirrors exactly these, so a path dropped from the list is
          deleted from the realm. Empty pushes the whole repository.
        type: string
        default: ""
      content-ref:
        description: |
          Git ref whose files become the preview's content. Empty checks
          out the ref the event names. A caller that runs on
          `pull_request_target` passes the pull request's head SHA here:
          its own job and scripts then come from the base branch, and the
          pull request supplies only files, which this workflow copies
          and pushes without running any of them.
        type: string
        default: ""
      fail-on-deploy-error:
        description: |
          Whether a failed install, sign-in, create, push, publish or
          unpublish fails this job. When false the check stays green: a
          failed deploy is reported in the sticky comment, and a failed
          cleanup leaves the comment unchanged, so the next run retries it.
        type: boolean
        default: true
      unpublish:
        description: |
          Unpublish the preview and say so in the sticky comment, as a
          closed PR does, while the PR stays open. For a caller whose PR no
          longer has anything to preview.
        type: boolean
        default: false
      publish-timeout-ms:
        description: |
          Total readiness-poll budget for `boxel realm publish`. Covers
          indexing *and* prerendering every instance in every format, so it
          scales with realm render cost rather than file count. 0 leaves the
          CLI's own limits: an hour in total, or 300000 without progress.
        type: number
        default: 0
    secrets:
      matrix-username:
        description: |
          Matrix username (without @ prefix or :domain suffix).
          Declared as a secret so callers can source it from either
          `vars.*` or `secrets.*` — `with:` blocks disallow the
          `secrets` context.
        required: true
      matrix-password:
        required: true

jobs:
  deploy:
    if: github.event.action != 'closed' && !inputs.unpublish
    name: Deploy preview realm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.content-ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install Boxel CLI
        id: install
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        run: npm install -g @cardstack/boxel-cli@${{ inputs.boxel-cli-version }}

      - name: Configure boxel profile
        id: profile
        if: steps.install.outcome == 'success'
        working-directory: ${{ runner.temp }}
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          MATRIX_URL: ${{ inputs.matrix-url }}
          MATRIX_USERNAME: ${{ secrets.matrix-username }}
          BOXEL_PASSWORD: ${{ secrets.matrix-password }}
          REALM_SERVER: ${{ inputs.realm-server-url }}
        run: |
          # Domain inference mirrors `boxel profile add`'s URL-based
          # default. Passing `--realm-server-url` keeps the profile
          # pointed at the caller-supplied realm-server explicitly.
          if echo "$MATRIX_URL" | grep -q "boxel.ai"; then
            DOMAIN="boxel.ai"
          elif echo "$MATRIX_URL" | grep -q "stack.cards"; then
            DOMAIN="stack.cards"
          else
            DOMAIN="localhost"
          fi
          # BOXEL_PASSWORD is read from env to avoid leaking the
          # password via the process arg list — see boxel-cli's own
          # warning in build-program.ts.
          boxel profile add \
            --user "@${MATRIX_USERNAME}:${DOMAIN}" \
            --matrix-url "${MATRIX_URL}" \
            --realm-server-url "${REALM_SERVER}"

      - name: Create preview realm
        id: create
        if: steps.profile.outcome == 'success'
        working-directory: ${{ runner.temp }}
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          REALM_ENDPOINT: ${{ inputs.realm-endpoint-prefix }}${{ github.event.pull_request.number }}
          DISPLAY_NAME: "${{ inputs.display-name-prefix }} #${{ github.event.pull_request.number }} Preview"
        run: |
          # `boxel realm create` exits non-zero when the realm already
          # exists. PR re-pushes are common and harmless - tolerate the
          # conflict and let the push step update content.
          echo "Creating realm: ${REALM_ENDPOINT}"
          set +e
          OUTPUT=$(boxel realm create "$REALM_ENDPOINT" "$DISPLAY_NAME" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Realm created"
          elif echo "$OUTPUT" | grep -qi "already exists\|409\|conflict"; then
            echo "Realm already exists, continuing"
          else
            echo "Failed to create realm (exit code $EXIT_CODE)"
            exit 1
          fi

      - name: Push content to preview realm
        id: push
        if: steps.create.outcome == 'success'
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          REALM_SERVER: ${{ inputs.realm-server-url }}
          MATRIX_USERNAME: ${{ secrets.matrix-username }}
          REALM_ENDPOINT: ${{ inputs.realm-endpoint-prefix }}${{ github.event.pull_request.number }}
          PUSH_PATHS: ${{ inputs.paths }}
        run: |
          SOURCE_REALM_URL="${REALM_SERVER%/}/${MATRIX_USERNAME}/${REALM_ENDPOINT}/"
          SOURCE_DIR="$GITHUB_WORKSPACE"
          if [ -n "${PUSH_PATHS//[[:space:]]/}" ]; then
            SOURCE_DIR="${RUNNER_TEMP}/preview-content"
            mkdir -p "$SOURCE_DIR"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                /* | .. | ../* | */../* | */..)
                  echo "::error title=Preview realm::Path '${path}' is not inside the repository."
                  exit 1
                  ;;
              esac
              if [ ! -e "$path" ]; then
                echo "::warning title=Preview realm::Path '${path}' does not exist, skipping it."
                continue
              fi
              # A symbolic link on the way to a path would have the copy
              # take files from outside the repository.
              part="$path"
              while [ "$part" != . ]; do
                if [ -L "$part" ]; then
                  echo "::error title=Preview realm::'${part}' is a symbolic link. A listed path must be reached through regular folders."
                  exit 1
                fi
                part=$(dirname "$part")
              done
              mkdir -p "${SOURCE_DIR}/$(dirname "$path")"
              cp -R "$path" "${SOURCE_DIR}/$(dirname "$path")/"
              # The CLI reads ignore files only inside the folder it pushes,
              # so carry the ones above each path along with it.
              dir=$(dirname "$path")
              while :; do
                for ignore in .gitignore .boxelignore; do
                  if [ -f "${dir}/${ignore}" ] && [ ! -e "${SOURCE_DIR}/${dir}/${ignore}" ]; then
                    mkdir -p "${SOURCE_DIR}/${dir}"
                    cp "${dir}/${ignore}" "${SOURCE_DIR}/${dir}/${ignore}"
                  fi
                done
                [ "$dir" = . ] && break
                dir=$(dirname "$dir")
              done
            done <<< "$PUSH_PATHS"
            echo "Staged $(find "$SOURCE_DIR" -type f | wc -l | tr -d ' ') file(s) from the listed paths"
          fi
          # The CLI reads `.env` from the directory it runs in, so it runs
          # outside the checkout.
          cd "$RUNNER_TEMP"
          echo "Pushing content to ${SOURCE_REALM_URL}"
          boxel realm push "$SOURCE_DIR" "${SOURCE_REALM_URL}" --delete

      - name: Compute comment fields
        if: ${{ !cancelled() }}
        id: stamp
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "now=$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "short_sha=${HEAD_SHA::7}"
            echo "published_url=${{ inputs.published-realm-base }}/${{ inputs.realm-endpoint-prefix }}${{ github.event.pull_request.number }}/"
          } >> "$GITHUB_OUTPUT"

      # Said before publishing, so a run cancelled mid-publish still leaves a
      # comment that tells a later run there may be a preview to unpublish.
      - name: Say the preview is publishing
        if: steps.push.outcome == 'success'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: ${{ inputs.sticky-header }}
          message: |
            ## Preview Realm - Publishing

            The preview realm for commit `${{ steps.stamp.outputs.short_sha }}` is being published.

      - name: Publish preview realm
        id: publish
        if: steps.push.outcome == 'success'
        working-directory: ${{ runner.temp }}
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          REALM_SERVER: ${{ inputs.realm-server-url }}
          MATRIX_USERNAME: ${{ secrets.matrix-username }}
          REALM_ENDPOINT: ${{ inputs.realm-endpoint-prefix }}${{ github.event.pull_request.number }}
          PUBLISHED_BASE: ${{ inputs.published-realm-base }}
          PUBLISH_TIMEOUT_MS: ${{ inputs.publish-timeout-ms }}
        run: |
          # `boxel realm publish` defaults to retrying on 400/409 by
          # auto-unpublishing the previous publication first, so PR
          # re-pushes get a clean re-publish without manual conflict
          # handling.
          SOURCE_REALM_URL="${REALM_SERVER%/}/${MATRIX_USERNAME}/${REALM_ENDPOINT}/"
          PUBLISHED_REALM_URL="${PUBLISHED_BASE%/}/${REALM_ENDPOINT}/"
          echo "Publishing ${SOURCE_REALM_URL} to ${PUBLISHED_REALM_URL}"
          TIMEOUT_ARGS=()
          if [ "${PUBLISH_TIMEOUT_MS}" -gt 0 ]; then
            TIMEOUT_ARGS=(--timeout "${PUBLISH_TIMEOUT_MS}")
          fi
          boxel realm publish "${SOURCE_REALM_URL}" "${PUBLISHED_REALM_URL}" \
            "${TIMEOUT_ARGS[@]}"

      - name: Comment on PR with preview URL
        if: steps.publish.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: ${{ inputs.sticky-header }}
          message: |
            ## Preview Realm

            Your preview realm is live: **${{ steps.stamp.outputs.published_url }}**

            _Updated at ${{ steps.stamp.outputs.now }} UTC for commit `${{ steps.stamp.outputs.short_sha }}`_

      - name: Report failure on PR
        if: ${{ !cancelled() && steps.publish.outcome != 'success' }}
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: ${{ inputs.sticky-header }}
          message: |
            ## Preview Realm - Deploy Failed

            Failed to deploy preview realm for commit `${{ steps.stamp.outputs.short_sha }}`.

            [View workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            _${{ steps.stamp.outputs.now }} UTC_

  cleanup:
    if: github.event.action == 'closed' || inputs.unpublish
    name: Cleanup preview realm
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install Boxel CLI
        id: install
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        run: npm install -g @cardstack/boxel-cli@${{ inputs.boxel-cli-version }}

      - name: Configure boxel profile
        id: profile
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          MATRIX_URL: ${{ inputs.matrix-url }}
          MATRIX_USERNAME: ${{ secrets.matrix-username }}
          BOXEL_PASSWORD: ${{ secrets.matrix-password }}
          REALM_SERVER: ${{ inputs.realm-server-url }}
        run: |
          if echo "$MATRIX_URL" | grep -q "boxel.ai"; then
            DOMAIN="boxel.ai"
          elif echo "$MATRIX_URL" | grep -q "stack.cards"; then
            DOMAIN="stack.cards"
          else
            DOMAIN="localhost"
          fi
          # BOXEL_PASSWORD is read from env to avoid leaking the
          # password via the process arg list — see boxel-cli's own
          # warning in build-program.ts.
          boxel profile add \
            --user "@${MATRIX_USERNAME}:${DOMAIN}" \
            --matrix-url "${MATRIX_URL}" \
            --realm-server-url "${REALM_SERVER}"

      - name: Unpublish preview realm
        id: unpublish
        if: steps.profile.outcome == 'success'
        continue-on-error: ${{ !inputs.fail-on-deploy-error }}
        env:
          PUBLISHED_BASE: ${{ inputs.published-realm-base }}
          REALM_ENDPOINT: ${{ inputs.realm-endpoint-prefix }}${{ github.event.pull_request.number }}
        run: |
          # `--tolerate-missing` exits 0 when the realm is already gone,
          # so PRs that were closed without ever having been published
          # (or that got cleaned up by an earlier run) don't fail the
          # cleanup job.
          PUBLISHED_REALM_URL="${PUBLISHED_BASE%/}/${REALM_ENDPOINT}/"
          echo "Unpublishing ${PUBLISHED_REALM_URL}"
          boxel realm unpublish "${PUBLISHED_REALM_URL}" --tolerate-missing

      - name: Cleanup timestamp
        id: stamp
        run: echo "now=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Update PR comment
        if: steps.unpublish.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: ${{ inputs.sticky-header }}
          message: |
            ## Preview Realm - Cleaned Up

            The preview realm for this PR has been unpublished.

            _Cleaned up at ${{ steps.stamp.outputs.now }} UTC_
