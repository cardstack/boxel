name: Diff Skills

on:
  # TEMP: pull_request trigger disabled while debugging vite-build SF tests.
  # Revert this block to restore PR runs.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-skills:
    uses: cardstack/gh-actions/.github/workflows/diff-skills.yml@main
    secrets: inherit
    concurrency:
      group: diff-skills-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
