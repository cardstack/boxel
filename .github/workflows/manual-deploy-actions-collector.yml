name: Manual Deploy [actions-collector]

# Builds and deploys the GitHub Actions queue collector
# (packages/observability/collectors/actions-queue.ts), whose output feeds the
# "GitHub Actions Queue" Grafana dashboard.
#
# Deliberately not triggered by CI: this samples the Actions queue, so running
# its own deploy through a busy queue is the situation it exists to measure.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: false
        default: staging
  # TEMPORARY — remove before merge. A workflow_dispatch workflow can only be
  # dispatched once its file is on the default branch, so until this merges
  # there is no way to build the collector, and without a running collector the
  # dashboard on this PR previews with every panel empty. This trigger closes
  # that loop so the queries can be checked against real data before merging.
  push:
    branches: [cs-12571-make-the-github-actions-backlog-visible-in-grafana]

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  build-actions-collector:
    name: Build actions-collector Docker image
    uses: cardstack/gh-actions/.github/workflows/docker-ecr.yml@main
    secrets: inherit
    with:
      repository: "boxel-actions-collector-${{ inputs.environment || 'staging' }}"
      environment: ${{ inputs.environment || 'staging' }}
      dockerfile: "packages/observability/collectors/Dockerfile"

  deploy-actions-collector:
    needs: [build-actions-collector]
    name: Deploy actions-collector to AWS ECS
    uses: cardstack/gh-actions/.github/workflows/ecs-deploy.yml@main
    secrets: inherit
    with:
      container-name: "boxel-actions-collector"
      environment: ${{ inputs.environment || 'staging' }}
      cluster: ${{ inputs.environment || 'staging' }}
      service-name: "boxel-actions-collector-${{ inputs.environment || 'staging' }}"
      image: ${{ needs.build-actions-collector.outputs.image }}
      wait-for-service-stability: false
