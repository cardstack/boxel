name: Observability — PR preview

# Spins up a per-PR preview of the dashboards a PR changes inside BOTH the
# staging and the production Grafana, under per-PR-prefixed UIDs (`pr<n>-*`)
# in a per-PR folder so the preview coexists with the canonical copies
# without overwriting them. On PR close both previews are torn down. A
# separate sweep workflow (observability-preview-sweep.yml) is the safety net
# for closes the preview-cleanup job missed.
#
# Both environments are previewed from one job so the PR gets a single
# sticky comment linking each changed dashboard in both Grafanas, rather
# than one comment per environment. Staging is applied first: a production
# Grafana problem then costs the run its red status but not the staging
# preview or the comment, which is posted from whatever succeeded.
#
# The two environments render the same dashboard set under the same preview
# UIDs — only the apply-time substitutions (realm-server URL, Grafana
# operator secret) differ, so the comment lists each dashboard once with a
# link per environment.
#
# Scope: dashboards + folders only. Data sources, alert rules, and the
# home-dashboard preference are file-provisioned at Grafana startup and
# can't be previewed per-PR — the existing observability-diff.yml comment
# already surfaces their changes. CS-11106.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "packages/observability/**"
      - ".github/workflows/observability-preview.yml"
      # The two actions that put grafanactl on PATH: a change to either is
      # otherwise invisible to CI, since no other workflow runs them on a PR.
      - ".github/actions/install-grafanactl/**"
      - ".github/actions/fetch-cached-release-asset/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  # Serialize per-PR so a force-push after an open doesn't race the previous
  # push, but allow different PRs to run in parallel. Don't cancel in-flight —
  # we never want to leave the preview in a half-pushed state.
  group: observability-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Reuses the apply roles from cardstack/infra#665 (staging) and #666
  # (production) — the same roles observability-apply-staging.yml and
  # observability-apply-production.yml use. Both trust
  # `repo:cardstack/boxel:*` with no ref condition, so a pull_request-
  # triggered run can assume them. Permissions cover every SSM path read
  # below — see those workflows' headers for the up-to-date list.
  STAGING_AWS_ROLE_ARN: arn:aws:iam::680542703984:role/boxel-observability-apply
  PRODUCTION_AWS_ROLE_ARN: arn:aws:iam::120317779495:role/boxel-observability-apply
  PREVIEW_MARKER: "<!-- observability-preview -->"
  STAGING_GRAFANA_BASE_URL: "https://dashboard-staging.stack.cards"
  PRODUCTION_GRAFANA_BASE_URL: "https://dashboard.boxel.ai"

jobs:
  preview-apply:
    name: Apply preview
    # Fork-PR guard: this job assumes AWS and pushes to staging and
    # production Grafana, so it must not run on PRs whose code we don't
    # trust. Same pattern as observability-diff.yml and
    # observability-apply-staging.yml.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # render-preview.sh runs `git diff origin/<base>...HEAD` to detect
          # changed dashboards, so we need full history to reach the merge-base
          # (same constraint as observability-diff.yml).
          fetch-depth: 0

      - name: Fetch PR base ref
        # Ensure origin/<base> is fully available — no `--depth=1`.
        # A shallow base makes `git diff origin/<base>...HEAD` fail with
        # "no merge base" whenever main has advanced past the PR's true
        # merge base (i.e., any PR in flight long enough for a merge to
        # land on main). Unbounded fetch is cheap against the full repo
        # the checkout step already pulled (fetch-depth: 0).
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "${PR_BASE_REF}"

      - name: Install grafanactl
        uses: ./.github/actions/install-grafanactl

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply preview to staging
        id: apply-staging
        working-directory: packages/observability
        env:
          ENV_NAME: staging
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./scripts/ci-apply-preview.sh

      # Production is applied after staging, and each environment's
      # credentials live only in the step that uses them — the AWS creds in
      # the runner environment and the Grafana token inside the step's own
      # shell. Nothing is written to $GITHUB_ENV, so there's no window in
      # which one environment's token is live while the other's push runs.
      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply preview to production
        id: apply-production
        working-directory: packages/observability
        env:
          ENV_NAME: production
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./scripts/ci-apply-preview.sh

      - name: Post sticky PR comment
        # Runs even when an apply step failed, so a production-side outage
        # still leaves reviewers the staging links (and a note saying which
        # environment is missing). The job is still red — the failed step
        # decides that, not this one.
        #
        # Pinned to SHA (matches observability-diff.yml's reasoning):
        # pull-requests: write + AWS role = non-trivial supply-chain exposure.
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGING_OUT_FILE: ${{ steps.apply-staging.outputs.out_file }}
          STAGING_OUTCOME: ${{ steps.apply-staging.outcome }}
          PRODUCTION_OUT_FILE: ${{ steps.apply-production.outputs.out_file }}
          PRODUCTION_OUTCOME: ${{ steps.apply-production.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.PREVIEW_MARKER;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Parse one environment's `<KIND>:<uid>:<title>` summary (the
            // structured stdout of apply-preview.sh). A missing file means
            // the apply step never got far enough to write one.
            const readSummary = (outFile) => {
              if (!outFile || !fs.existsSync(outFile)) return null;
              const folders = [];
              const dashboards = [];
              for (const line of fs.readFileSync(outFile, 'utf8').trim().split('\n')) {
                // Title may contain `:`, so only the first two fields are
                // delimited.
                const m = line.match(/^(FOLDER|DASHBOARD):([^:]+):(.*)$/);
                if (!m) continue;
                const [, kind, uid, title] = m;
                (kind === 'FOLDER' ? folders : dashboards).push({ uid, title });
              }
              return { folders, dashboards };
            };

            const environments = [
              {
                name: 'staging',
                baseUrl: process.env.STAGING_GRAFANA_BASE_URL,
                outcome: process.env.STAGING_OUTCOME,
                summary: readSummary(process.env.STAGING_OUT_FILE),
              },
              {
                name: 'production',
                baseUrl: process.env.PRODUCTION_GRAFANA_BASE_URL,
                outcome: process.env.PRODUCTION_OUTCOME,
                summary: readSummary(process.env.PRODUCTION_OUT_FILE),
              },
            ];

            // Find any prior preview sticky on this PR; we either update,
            // delete, or deliberately leave it alone below.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(
              c => c.body && c.body.startsWith(marker),
            );

            const applied = environments.filter(
              e => e.outcome === 'success' && e.summary && e.summary.dashboards.length,
            );
            const missing = environments.filter(e => e.outcome !== 'success');

            if (!applied.length) {
              if (missing.length) {
                // At least one apply failed and nothing is left to link.
                // Leave any prior sticky in place: preview resources from
                // an earlier push may well still be live, and the failed
                // step already makes the run red.
                core.info(
                  `No preview to link and ${missing.map(e => e.name).join(', ')} did not apply — leaving any existing comment alone.`,
                );
                return;
              }
              // Every environment applied cleanly and none had dashboards:
              // this HEAD changes no dashboards. Don't post a "nothing to
              // see" comment — if a prior push left a sticky behind, delete
              // it so the PR's comment stream matches its current state.
              // (Stale preview *resources* from a prior push are deleted by
              // ci-apply-preview.sh.)
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
                core.info(`Deleted stale sticky comment ${existing.id}`);
              } else {
                core.info('No dashboard changes — nothing to post.');
              }
              return;
            }

            // Both environments render the same preview UIDs, so collapse
            // them into one row per resource carrying a link per
            // environment. Keyed by UID and built in the order the first
            // applied environment reported, so a partial apply still lists
            // everything that made it somewhere.
            const collapse = (key) => {
              const byUid = new Map();
              for (const env of applied) {
                for (const { uid, title } of env.summary[key]) {
                  if (!byUid.has(uid)) byUid.set(uid, { title, envs: [] });
                  byUid.get(uid).envs.push(env);
                }
              }
              return [...byUid.entries()].map(([uid, v]) => ({ uid, ...v }));
            };

            const links = (envs, path) =>
              envs
                .map(e => `[${e.name}](${e.baseUrl}${path})`)
                .join(' · ');

            const folders = collapse('folders');
            const dashboards = collapse('dashboards');

            const folderLines = folders.map(
              f => `- **Folder:** ${f.title} — ${links(f.envs, `/dashboards/f/${f.uid}/`)}`,
            );
            const dashboardLines = dashboards.map(
              d => `- ${d.title} — ${links(d.envs, `/d/${d.uid}/`)}`,
            );

            const appliedNames = applied.map(e => e.name).join(' and ');

            const warning = missing.length
              ? [
                  '',
                  '> [!WARNING]',
                  `> The **${missing.map(e => e.name).join('** and **')}** preview did not apply on this run — see the run log below.`,
                ]
              : [];

            const body = [
              marker,
              '## Grafana preview',
              '',
              `Preview deployed for **${dashboards.length} dashboard${dashboards.length === 1 ? '' : 's'}** in ${appliedNames}.`,
              "Cross-dashboard drill-throughs still point at each environment's canonical dashboards.",
              ...warning,
              '',
              ...folderLines,
              '',
              '**Dashboards:**',
              ...dashboardLines,
              '',
              'Previews are torn down automatically when this PR is closed or merged.',
              '',
              `_(Run: ${runUrl})_`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated sticky comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created sticky comment');
            }

  preview-cleanup:
    name: Cleanup preview
    # Cleanup runs on the `closed` action (covers both merge and close-
    # without-merge). Same fork-PR guard — cleanup hits staging and
    # production.
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install grafanactl
        uses: ./.github/actions/install-grafanactl

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.STAGING_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cleanup preview from staging
        working-directory: packages/observability
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/cleanup-preview.sh --pr "$PR_NUMBER" --env staging

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cleanup preview from production
        working-directory: packages/observability
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/cleanup-preview.sh --pr "$PR_NUMBER" --env production

      - name: Delete sticky PR comment
        # After cleanup, there's nothing left to point at — delete the
        # sticky entirely rather than leaving a "preview cleaned up"
        # gravestone. Matches the apply-time policy of not posting a
        # comment when there's nothing to show.
        #
        # Runs even if a cleanup step failed: the daily sweep
        # (observability-preview-sweep.yml) will catch whatever survived,
        # and a comment pointing at deleted dashboards is worse than none.
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = process.env.PREVIEW_MARKER;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(
              c => c.body && c.body.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
              core.info(`Deleted sticky comment ${existing.id}`);
            } else {
              core.info('No preview comment to delete — skipping.');
            }
