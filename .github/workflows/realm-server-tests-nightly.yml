name: Realm-server tests (nightly)

# The nightly suite of the realm-server tests (packages/realm-server/tests/
# test-suites.json): generated cases and races too slow to run on every pull
# request at full size. A suite that samples its generated cases on a pull
# request reads QUERY_TESTS_EXTENDED=1 as "run them all", and a race that
# repeats reads QUERY_RACE_RUNS. This workflow runs the suite once a day
# against main, so a defect only a rare case finds shows up the next morning.
#
# Run it by hand (workflow_dispatch) before a release, or with more race
# runs to chase a flaky failure. While the nightly suite is empty it says so
# and stops.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      race_runs:
        description: How many times a repeating race runs
        required: false
        default: "10"

concurrency:
  group: realm-server-tests-nightly
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the warm-test-images step pull the private GHCR mirror packages.
  packages: read

jobs:
  suite:
    name: List the nightly suite
    if: github.repository == 'cardstack/boxel'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: List the nightly suite's modules
        id: list
        working-directory: packages/realm-server
        run: |
          if modules=$(node scripts/test-suites.cjs nightly); then
            echo "modules=$modules" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The nightly suite has no test modules; nothing to run."
          fi

  test-web-assets:
    name: Build test web assets
    needs: suite
    if: needs.suite.outputs.modules != ''
    uses: ./.github/workflows/test-web-assets.yaml
    with:
      caller: realm-server-tests-nightly

  query-tests:
    name: Nightly suite at full size
    needs: [suite, test-web-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/init
      - name: Download test web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.test-web-assets.outputs.artifact_name }}
          path: .test-web-assets-artifact
      - name: Restore test web assets into workspace
        shell: bash
        run: |
          shopt -s dotglob
          cp -a .test-web-assets-artifact/. ./
      - name: Warm test Docker images from the GHCR mirror
        continue-on-error: true
        uses: ./.github/actions/warm-test-images
      - name: Start test services (icons + host dist + realm servers)
        run: mise run test-services:realm-server | tee -a /tmp/server.log &
      - name: create realm users
        run: pnpm register-realm-users
        working-directory: packages/matrix
      - name: nightly suite
        run: pnpm test:wait-for-servers
        working-directory: packages/realm-server
        env:
          TEST_MODULES: ${{ needs.suite.outputs.modules }}
          QUERY_TESTS_EXTENDED: "1"
          QUERY_RACE_RUNS: ${{ github.event.inputs.race_runs || '10' }}
          JUNIT_OUTPUT_FILE: ${{ github.workspace }}/junit/realm-server-tests-nightly.xml
      - name: Upload junit report
        uses: ./.github/actions/upload-artifact-retry
        if: ${{ !cancelled() }}
        with:
          name: realm-server-tests-nightly-report
          path: junit/realm-server-tests-nightly.xml
          retention-days: 30
      - name: Print realm server logs
        if: ${{ !cancelled() }}
        run: cat /tmp/server.log
